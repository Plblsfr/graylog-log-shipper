name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build plugin
        run: ./gradlew --no-daemon test buildPlugin

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="build/distributions/graylog-log-shipper-${VERSION}.zip"
          test -f "$ZIP" || { echo "::error::$ZIP not found"; ls build/distributions; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: replacing its zip (bump version in build.gradle.kts for a new release)."
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Graylog Log Shipper $VERSION" \
              --generate-notes
          fi
